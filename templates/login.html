{% extends "base.html" %}
{% block title %}Admin sign-in · Boiler Bulletin{% endblock %}
{% block content %}
<section class="wrap content narrow">
  <h1>Admin sign-in</h1>
  {% if unavailable %}
    <p>Set SECRET_KEY and ADMIN_PASSWORD on the server to enable admin access.</p>
  {% else %}
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form class="stack card" method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
      <button>Sign in</button>
    </form>
  {% endif %}
</section>
{% endblock %}
